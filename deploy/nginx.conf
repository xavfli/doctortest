# Plain HTTP reverse proxy — the zero-configuration starting point.
# Once a certificate exists, deploy/nginx.https.conf.template takes over and
# redirects everything to HTTPS.

upstream osh_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    # ACME challenges stay on HTTP so certificates can be renewed.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 4m;

    # Safe headers for a browser-served SPA.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://osh_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Exam runners need long-lived requests to survive a slow connection.
        proxy_read_timeout 120s;
    }
}